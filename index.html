<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的专属手机</title>
    <style>
        body {
            background-color: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .phone {
            width: 350px;
            height: 700px;
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 12px solid #333;
            position: relative;
        }
        .time { position: absolute; top: 20px; left: 30px; font-weight: bold; }
        .content { text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="time">9:41</div>
        <div class="content">
            <h2>🎉 恭喜你！</h2>
            <p>你成功做出了人生第一个网页！</p >
            <p style="font-size: 12px; margin-top: 50px;">（这是测试用的手机壳，稍后我们再把你想放的聊天记录或图片替换进来）</p >
        </div>
    </div>
</body>
</html>
